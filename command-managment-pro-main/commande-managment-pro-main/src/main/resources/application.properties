spring.application.name=commande-app

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/nourriture_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Entity Scanning Configuration
spring.jpa.properties.hibernate.packagesToScan=com.nourriture
spring.jpa.open-in-view=true

# Server Configuration
server.port=9090